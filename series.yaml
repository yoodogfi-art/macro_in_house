# The data you want. Edit this, then run:  python pull.py
#
# Each entry needs a unique name (becomes the CSV filename) and a source block.
# FRED: give the series id (+ optional start/end/frequency/units).
# KOSIS: paste the generated URL. The apiKey in it is ignored (key comes from
#        .env), so you can leave it or strip it — your call.
us_unemployment:
  fred:
    id: UNRATE
    start: "2000-01-01"

us_core_cpi:
  fred:
    id: CPILFESL
    start: "2000-01-01"

# 이게뭐지
kr_cpi_goods:
